[bar.default]
capsule = true
capsule_opacity = 0.89999997988343239
capsule_padding = 8.0
capsule_thickness = 0.84999998472630978
center = [ "weather", "clock", "media" ]
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center" ]
font_family = "Noto Sans"
margin_ends = 0
padding = 0
radius = 0
scale = 0.90000000596046448
start = [ "launcher", "workspaces", "cpu", "ram", "temp" ]
thickness = 24

    [bar.default.dead_zone.actions]
    scroll_down = "workspace-switch next"
    scroll_up = "workspace-switch prev"

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

    [calendar.account.personal_google]
    color = "primary"
    type = "google"

[config]

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-4", "lockscreen-login-box@HDMI-A-3", "lockscreen-login-box@DP-5" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-4"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "DP-4"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-4".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-5"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-5"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-5".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-3"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

[osd.kinds]
media = false

[shell]
font_family = "DejaVu Sans"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
screen_time_enabled = true

    [shell.animation]
    enabled = false

    [shell.launcher.providers.calculator]
    prefix = ""

    [shell.launcher.providers.emoji]
    global = true
    prefix = "!"

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_launcher = true

    [shell.screenshot]
    directory = "/home/isaaki/Pictures/Screenshots"

[templates]

[theme]
builtin = "Tokyo-Night"
community_palette = "Tokyo Night Storm"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "kitty" ]

[wallpaper]
directory = "/home/isaaki/Pictures/Wallpapers/Space"

    [wallpaper.default]
    path = "/home/isaaki/Pictures/Wallpapers/Space/Space_Wallpaper_2.png"

    [wallpaper.last]
    path = "/home/isaaki/Pictures/Wallpapers/Space/Space_Wallpaper_2.png"

    [wallpaper.monitors.DP-4]
    path = "/home/isaaki/Pictures/Wallpapers/Space/Space_Wallpaper_2.png"

    [wallpaper.monitors.DP-5]
    path = "/home/isaaki/Pictures/Wallpapers/Space/Space_Wallpaper_2.png"

    [wallpaper.monitors.HDMI-A-3]
    path = "/home/isaaki/Pictures/Wallpapers/Space/Space_Wallpaper_2.png"

[widget.audio_visualizer]
centered = false
mirrored = false
width = 193

[widget.clock]
anchor = true
format = "{:%H:%M:%S | %d %b %Y}"

[widget.media]
artist_first = true
hide_when_no_media = true
max_length = 300
title_scroll = "on_hover"

[widget.network.actions]
right = "none"

[widget.temp]
display = "text"
